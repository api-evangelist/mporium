name: Mporium
description: >-
  Mporium (Mporium Group plc, formerly MoPowered) was a London-based, "mobile
  first" data-driven marketing and advertising-technology company founded in
  2012. Its proprietary IMPACT platform delivered software-as-a-service that
  helped agencies and advertisers identify and act on consumer "micro-moments"
  across search, social, and display media, reacting to real-time signals from
  TV, news feeds, sports, financial data, and social media to optimise ad
  pricing, timing, and selection. The group also acquired the digital agency
  Fast Web Media. Mporium was a portfolio company of the fintech venture firm
  Anthemis and was previously listed on the London Stock Exchange. The company
  is now defunct: it has been delisted, publishes no developer portal or public
  API, and its primary domain (mporium.com) is parked and listed for sale. This
  profile is retained as a historical company record in the API Evangelist
  network; there is no live API surface to enrich.
